enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 3
max_temp_lost_count: 10
outpost_max_temp_lost_count: 75

#####-----aimer参数-----
yaw_offset: -1.4
pitch_offset: 0.9
comming_angle: 60
leaving_angle: 15
decision_speed: 4
high_speed_delay_time: -0.48  # 略微减少高速延迟，进一步提高响应速度
low_speed_delay_time: -0.068  # 略微减少低速延迟

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree 降低容差提高精度
second_tolerance: 2 # 远距离射击容差，degree 降低容差提高精度
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 1.0
gain: 16.0
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.0430px
camera_matrix: [2450.9723746520576, 0, 742.7181066016492, 0, 2452.6741548613691, 526.91671562286535, 0, 0, 1]
distort_coeffs: [-0.01871543751314814, 0.060011566736044429, -0.0042735757854047039, 0.0021636264421155496, 0]

# 相机同理想情况的偏角: yaw-1.55 pitch1.88 roll-0.58 degree
# 标定板到世界坐标系原点的水平距离: 1.89 m
# 标定板同竖直摆放时的偏角: yaw0.44 pitch14.94 roll-0.03 degree
