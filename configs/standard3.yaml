# t_camera2gimbal: [-0.041098967871920619, 0.084275111093168681, 0.13270812750159233]

# 相机同理想情况的偏角: yaw-2.16 pitch2.15 roll-0.93 degree
R_camera2gimbal: [0.098804797586225623, -0.039947755186193305, 0.99430467605735873, -0.99226253766782069, 0.071537921703336282, 0.1014760173606756, -0.075184229163846567, -0.99663759843483291, -0.032570371061547698]
t_camera2gimbal: [-0.51596226784770838, -0.23629886964756361, 0.25997675265353731]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----
com_port: "/dev/ttyACM0"
# yaw_kp: 0  # 进一步增加yaw轴比例增益，提高响应速度
# yaw_kd: 0  # 进一步增加yaw轴微分增益，减少剩余震荡
# pitch_kp: 0  # 进一步增加pitch轴比例增益，原先是0.22
# pitch_kd: 0  # 进一步增加pitch轴微分增益，原先是0.15

#####-----planner-----#####
fire_thresh: 0.0006  # 当前设置为0.0035弧度（约0.2度）

max_yaw_acc: 60  # 当前设置为60度/秒²
Q_yaw: [4e6, 6e6]  # 当前位置权重为4e6，速度权重为0
R_yaw: [1] # 当前设置为0.7
max_pitch_acc: 52  # 当前设置为100度/秒²
Q_pitch: [3e6, 2e5]  # 当前位置权重为6e6，速度权重为0
R_pitch: [1.1]  # 当前设置为0.7                           

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s 微调预测时间，可能需要根据实际情况调整
