enemy_color: "red"
#enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 3
max_temp_lost_count: 15

outpost_max_temp_lost_count: 75
outpost_radius: 0.2665
outpost_armor_z_offsets: [0.0, -0.102, 0.102]
outpost_fixed_center_rotation_model: true
outpost_spin_speed_lock: 2.63
outpost_coming_angle: 100
outpost_leaving_angle: 120
outpost_delay_time: 0.125
outpost_fire_z_compensation: [0.0, -0.012, 0.0]

#####-----aimer参数----
yaw_offset: -0.15
pitch_offset: 2.4
coming_angle: 55
leaving_angle: 20
decision_speed: 8
high_speed_delay_time: 0.056  # 略微减少高速延迟，进一步提高响应速度 
low_speed_delay_time: 0.10  # 略微减少低速延迟

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree 降低容差提高精度
second_tolerance: 2 # 远距离射击容差，degree 降低容差提高精度
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 5.0
gain: 16.0
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.0471px
camera_matrix: [1790.1994239678108, 0, 713.0805698505709, 0, 1788.9377898980804, 571.75787594809469, 0, 0, 1]
distort_coeffs: [-0.071611772992372258, 0.11840473738064419, -0.00069932824736574381, -0.00048690488028837358, 0]

