# 相机同理想情况的偏角: yaw-0.91 pitch-0.02 roll0.22 degree
R_camera2gimbal: [0.015942160097545122, -0.00041943671940238703, 0.99987282771573627, -0.9998652948205573, 0.0038976198828972741, 0.015943675004475393, -0.0039038115764127961, -0.99999231628652352, -0.00035724373893120109]
t_camera2gimbal: [0.043800814867209902, -0.00092419421675686174, 0.025975290143292605]


#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----
com_port: "/dev/ttyACM0"
gimbal_state_unit: "deg"
# yaw_kp: 0  # 进一步增加yaw轴比例增益，提高响应速度
# yaw_kd: 0  # 进一步增加yaw轴微分增益，减少剩余震荡
# pitch_kp: 0  # 进一步增加pitch轴比例增益，原先是0.22
# pitch_kd: 0  # 进一步增加pitch轴微分增益，原先是0.15

#####-----planner-----#####
fire_thresh: 0.005  # 当前设置为0.0035弧度（约0.2度）
bullet_speed_min: 10.0
bullet_speed_max: 25.0
bullet_speed_fallback: 22.0

max_yaw_acc: 110  # 当前设置为60度/秒² serial: SerialException device reports readiness to write but returned no data
Q_yaw: [5e6, 0]  # 当前位置权重为4e6，速度权重为0
R_yaw: [1.8] # 当前设置为0.7
max_pitch_acc: 125  # 当前设置为100度/秒²
Q_pitch: [2e5, 0]  # 当前位置权重为6e6，速度权重为0
R_pitch: [1.5]  # 当前设置为0.7

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s 微调预测时间，可能需要根据实际情况调整

#####-----web_debugger参数-----#####
show_local: false
disable_web: false
web_host: "0.0.0.0"
web_port: 8090
web_fps: 30.0
web_scale: 0.8
web_jpeg_quality: 55
web_client_ttl_ms: 1000

#####-----debug_record参数-----#####
record_raw_video: false
record_debug_video: false
record_debug_fps: 30.0
record_debug_dir: "records"
