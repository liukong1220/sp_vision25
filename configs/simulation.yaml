#####-----tracker参数-----#####
# 判定相机离线的帧间隔上限(秒)。默认 0.1 是实车流水线的量级；
# 本机 CPU 上 OpenVINO 跑一帧 YOLO 就要 110ms 以上(detect_ms p50≈113ms)，
# 闭环实测 fps≈7.8，dt 恒在 0.13~0.16s，用 0.1 会让 tracker 每帧被打回 lost
# (实测 tracked_frames 只有 5/91)。这里放宽到 0.35s，只是把“离线”判据对齐到
# 本机真实帧率，不改变实车默认值。
tracker_max_dt: 0.35
min_detect_count: 3
max_temp_lost_count: 15

outpost_max_temp_lost_count: 75
# EKF 过程噪声。实车默认 100 / 400，仿真必须压到 1/500 才不发散，原因如下。
#
# planner 的参考轨迹是 target.predict(-0.51s) 走到 predict(+0.49s)，取中点下发
# （planner.cpp: get_trajectory / HALF_HORIZON），也就是把 EKF 的速度状态乘上
# ±0.5s 再送进 MPC；而 MPC 的初值 x0 取自它自己的参考轨迹 traj(0,0)，完全不读
# 云台反馈。这套设计在实车成立：dt≈5ms、帧龄≈10ms，速度状态几乎不会跑偏。
# 本机 dt≈0.13s、frame_age p50≈200ms（约 300ms 环路死时），
# 加速度方差 100 m²/s⁴ 意味着每步速度随机游走 σ=√(100*0.13)≈3.6m/s，
# 静止靶都能被拟合出 vcz≈-2m/s、vyaw≈±40deg/s，再乘 ±0.5s 就是 ±1m / ±20°，
# 下发角随即逐帧反号放大（实测 cmd pitch -7,+1.3,-13.4,+1,-12.4,+11.5,-32.6,+28.6），
# 云台被甩到 (+55.7,+54.0) 后目标永久丢失。
#
# 实测对比（同一静止靶，闭环，其余参数不变）：
#   100 / 400 -> tracked  30/116  safe_stops 89  final_faults 含 target_lost
#   4.0 / 16  -> tracked  54/129  lost 75 帧（按 variance*dt 等效缩放也不够）
#   1.0 / 10  -> tracked 188/189  lost  1 帧  vyaw 峰值 231deg/s
#   0.2 / 2.0 -> tracked 191/191  lost  0 帧  cmd pitch 仅在 -5.97..-3.10 抖动
# 取最后一组。代价是 σ_a≈0.45m/s²，真机动目标会跟不上；这是当前 8fps/200ms 帧龄
# 下的必然折中，帧率提上去之后应当同步往实车值调回。实车入口读自己的配置，不受影响。
tracker_acceleration_variance: 0.2
tracker_yaw_acceleration_variance: 2.0
tracker_roll_pitch_random_walk: 2.0e-3
tracker_geometry_random_walk: 1.0e-4
tracker_uvl_angle_variance: 2.5e-3
tracker_uvl_center_variance: 9.0
tracker_uvl_length_variance: 9.0
tracker_nis_gate: 20.090  # 8 DoF chi-square, 99%
inference_max_inflight: 3
outpost_radius: 0.2765
outpost_armor_z_offsets: [0.0, -0.102, 0.102]
outpost_fixed_center_rotation_model: true
outpost_spin_speed_lock: 2.51
outpost_coming_angle: 60
#决定“提前多早开始认定下一块板是应打板”，主要管选板提前量和轨迹连续性。
outpost_leaving_angle: 18
#决定“板进入正面附近后还能保留多久”，同时还间接决定最终 fire 相位窗口大小
outpost_delay_time: 0.078
outpost_fire_z_compensation: [0.0, -0.012, 0.0]

#####-----aimer参数----
# 仿真里没有真实机械零偏，先归零；单轴标定实验确认后再填。
yaw_offset: 0.0
# 保持 0：这是**真机标定量**，不该按仿真单场景的距离去拟合。
#
# 实测（闭环 60s，目标 1.48m / 2.50m，真值口径 = 枪口 -> 板心）：
#   pitch_offset: 0.0  -> aim_error p50=7.58 mean=7.26  pitch_mean=-7.02
#   pitch_offset:-7.0  -> aim_error p50=1.07 mean=1.55  pitch_mean=-0.98
# 误差几乎全是系统性的 pitch 偏高，yaw 本来就是居中的（mean=-0.47，±3.8）。
#
# 成因不是感知：把残差拆开后
#   muzzle_parallax_deg mean=4.99  枪口相对云台原点 +0.110m(ROS z)，而算法把
#                                  弹丸当成从云台原点出膛解弹道（tools::Trajectory
#                                  的 d/h 是相对云台原点的）
#   重力抬枪            约 0.7~1.1  25m/s 打 1.5~2.5m，本来就只需要这么点
#   geom_err mean=1.57            纯几何/估计误差（选板+EKF），与弹道无关
# 三项之和正好是那 7.26。
#
# 所以这是"炮塔枢轴 vs 出膛点"的建模简化，真机上同样存在，靠 pitch_offset 标定
# 吸收；本场景目标只有 1.5~2.5m，视差比重力补偿还大，才显得离谱。视差随距离变化
# （2.50m 时 2.53deg，1.48m 时 4.27deg），因此 -7.0 只对这个场景成立，不能当成
# 通用值写进来。要真正修掉得让弹道解算以枪口为原点，那属于算法侧改动，本次不做。
pitch_offset: 0.0
coming_angle: 50
leaving_angle: 25
decision_speed: 8
high_speed_delay_time: 0.07  # 略微减少高速延迟，进一步提高响应速度
low_speed_delay_time: 0.10  # 略微减少低速延迟

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree 降低容差提高精度
second_tolerance: 2 # 远距离射击容差，degree 降低容差提高精度
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

# 仿真入口不初始化物理相机与串口，以下硬件项仅为兼容旧配置读取而保留，实际不生效。
camera_name: "simulation"
exposure_ms: 5.0
gain: 16.0
vid_pid: "0000:0000"

# 仿真端发布的 gimbal 四元数已经是 world<-gimbal，不存在 imubody 中间系，取单位阵。
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 仿真相机是理想针孔模型，内参由 fov_y=45deg 与 1440x1080 反算：
#   fov_x = 2*atan(tan(fov_y/2) * 1440/1080)
#   fx = 1440/(2*tan(fov_x/2)) = fy = 1080/(2*tan(fov_y/2)) = 1303.6752833867
#   cx = 720, cy = 540（严格图像中心）
# sim_auto_aim 启动时会用共享内存里的 CameraInfo 交叉校验这几个数，
# 不一致超过 0.5px 直接拒绝启动，避免仿真端改了 fov 而这里没跟上。
camera_matrix: [1303.6752833867, 0, 720.0, 0, 1303.6752833867, 540.0, 0, 0, 1]
distort_coeffs: [0, 0, 0, 0, 0]


# 仿真里相机是理想安装，没有装配偏角：
#   相机 z(前) -> 云台 x(前)， 相机 x(右) -> 云台 -y， 相机 y(下) -> 云台 -z
R_camera2gimbal: [0, 0, 1, -1, 0, 0, 0, -1, 0]
# 相机相对云台的平移。仿真端每帧都会发布 Camera pose 的相对平移，
# sim_auto_aim 会把观测值打印出来并与这里比对，超过 sim.extrinsic_tol_m 报警。
# 实测值：由 sim_auto_aim 的外参自检从共享内存 Camera pose 读出（2026-08-29 passive 运行）。
t_camera2gimbal: [0.060025, 0.002017, 0.196342]



#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----
com_port: "/dev/null"  # 仿真不开串口
gimbal_state_unit: "deg"
# yaw_kp: 0  # 进一步增加yaw轴比例增益，提高响应速度
# yaw_kd: 0  # 进一步增加yaw轴微分增益，减少剩余震荡
# pitch_kp: 0  # 进一步增加pitch轴比例增益，原先是0.22
# pitch_kd: 0  # 进一步增加pitch轴微分增益，原先是0.15

#####-----planner-----#####
# fire_thresh 原来在这一节里出现了两次（0.005 与 0.0027），是从实车配置带过来的
# 重复键。yaml-cpp 取后出现的那个，也就是实际生效值一直是 0.0027 rad(≈0.155deg)，
