#####-----仿真链路参数（仅 sim_auto_aim 读取）-----#####
sim:
  # 共享内存目录。默认与 simulator 一致；指向别处可对着 FakePublisher 做离线联调。
  shm_dir: "/tmp"
  # 是否让 Tracker 按 enemy_color 过滤装甲板。仿真默认 false。
  #
  # 实测（--dump-detect，静态位姿、其余条件全不变，只改云台 pitch）：
  #   pitch=-2.0deg -> color=0(blue) conf=0.93  detected 21/21  tracked 22/22
  #   pitch=-3.8deg -> color=1(red)  conf=0.94  detected 22/22  tracked  0
  #   pitch=-5.4deg -> color=2(灭)   conf=0.89  detected 22/22  tracked  0
  # 同一块装甲板在画面里只挪了 38~70 像素，编号一直是 one、置信度一直 0.9+、
  # 单帧 PnP 一直是 (-0.016,1.49,0.09)（真值 (-0.023,1.481,0.033)，误差约 1cm），
  # 只有颜色类别在 blue/red/灭 之间乱跳；换曝光(ev100=7.5)则三个位姿全判成 red。
  # 也就是说合成图像对颜色分类头是分布外的，而 Tracker 会用颜色直接清空整帧结果，
  # 于是闭环表现为 detecting->tracking->temp_lost->lost 反复循环。
  # 关掉这道门之后仍保留编号、几何与 NIS 校验。实车入口不走这里，默认值仍是 true。
  use_enemy_color: false
  # 帧龄与心跳门限。
  # 这两个门限原来按"理想低延迟管线"取值（100ms / 200ms），在本机不可能满足：
  # 渲染->GPU 回读->共享内存->消费这一路实测 frame_age p50≈208ms、p95≈306ms、
  # p99≈342ms、max≈399ms（20s 闭环，153 帧）。后果是
  #   max_frame_age_ms=100  -> 每帧都被判过期，闭环根本跑不起来（一直靠 CLI 覆盖）
  #   state_timeout_ms=200  -> 同帧位姿一到手就已 stale，faults 恒含 state_stale，
  #                            而 fire_allowed() 要求 faults()==FAULT_NONE，
  #                            于是 --allow-fire 也永远打不出一发（实测
  #                            plan_fire 0 / fire 0 / suppressed_fire 152）。
  # 现在取"实测 p99 之上、心跳超时 500ms 之下"的 450ms：仍然是真实的过期保护
  # （断流 450ms 即禁火并安全停止），只是把判据对齐到本机真实延迟。
  # 帧率/回读延迟改善后应当同步调回。
  max_frame_age_ms: 450.0
  heartbeat_timeout_ms: 500.0
  read_timeout_ms: 1000.0
  # 断流看门狗：距上一帧到达超过这个时间就置 FAULT_NO_NEW_FRAME。
  # 必须小于 max_frame_age_ms，否则"帧龄已经超限"会比"断流"先发生，看门狗
  # 形同虚设；SimCamera::open() 会做这个夹取并打 warn。
  no_new_frame_timeout_ms: 250.0
  # 探测发布端是否换过共享内存文件（正常退出会 unlink，重启后是新 inode）的周期。
  remap_check_ms: 200.0
  # 换代/重连/时钟跳变之后，连续确认多少帧目标才解除 FAULT_REARM_PENDING。
  rearm_confirm_frames: 5
  # 真值评估的敌方队伍(red/blue/any)。场景里本车(Controlled)是红方，两台敌方
  # 步兵是蓝方；红蓝三号步兵共用 armor label=3，不指定队伍会匹配错车。
  # 顶层 enemy_color 只作用于实车 Tracker 的颜色门，与这里无关。
  enemy_team: "blue"
  # 命令角度映射：本侧下发 pitch_deg = pitch_scale*deg(pitch) + pitch_offset_deg。
  #
  # 结论：cmd.pitch_deg 就是算法侧的 ROS pitch 本身（正 = 低头，见
  # aimer.cpp:122 "世界坐标系下pitch向上为负"），所以正确映射是 identity。
  #
  # 共享内存探针实测（对着运行中的 simulator 下发单一角度，读回同一帧发布的
  # gimbal 四元数，取 q_raw*(1,0,0) 作为枪口在 ROS 系的指向）：
  #   cmd pitch=  0 -> fwd=(1.0000, 0, -0.0001)  elev= -0.01deg  水平
  #   cmd pitch=-20 -> fwd=(0.9409, 0,  0.3387)  elev=+19.80deg  抬头
  #   cmd pitch=+20 -> fwd=(0.9359, 0, -0.3523)  elev=-20.63deg  低头
  #   cmd pitch=-90 -> fwd=(0,      0,  1.0000)  elev=+90.00deg  垂直朝天
  # 同时 fb(raw) 的 ZYX pitch 在每个采样点都恒等于 cmd.pitch_deg
  # （0/-30/-90/+30 四点逐一吻合）。
  #
  # 之前这里填 -90.0 是错的：算法瞄一个水平目标时 ROS pitch≈0，编码成
  # cmd.pitch_deg=-90，仿真端就把枪口抬到 elev=+90（垂直朝天）。表现正是
  # "发弹总数在涨、但看不到弹丸和轨迹"（弹丸直上飞出画面）以及"云台不跟随目标"。
  #
  # 旧注释声称这是 probe 单轴实测确认的，判据是"下发角 == 反馈角"。该判据本身
  # 是满足的（identity 映射下它同样满足），但它只能验证映射自洽，**验证不了绝对
  # 指向**：任何 pitch_offset_deg 都能让 fb==cmd 成立。所以标定判据必须是枪口的
  # 绝对指向（elev），不能只看下发角与反馈角是否相等。
  # 单轴标定实验只应该改这四个数，不要改代码。
  yaw_scale: 1.0
  yaw_offset_deg: 0.0
  pitch_scale: 1.0
  pitch_offset_deg: 0.0
  # 反馈四元数的坐标系修正。
  #
  # 实测结论：不需要修正，取 0。仿真端 capture.rs 发布的是
  #   gimbal_rot = R_gimbal * R_muzzle_local * Rx(90deg)，再过 to_ros_quat。
  # Bevy 里枪管前向是该帧的局部 +Y，Rx(90deg) 把 +Y 送到 -Z（Bevy 的前向约定），
  # 于是 to_ros_quat 之后 ROS 的 +X 恰好就是出膛方向 —— 也就是说发布出来的
  # q_raw 已经是标准的 world<-gimbal（x 前 y 左 z 上），与 avian 实际用来
  # spawn 弹丸的方向逐点吻合（见上面 elev 一列）。
  #
  # 再右乘 Ry(+90°) 反而把姿态又转掉 90°：那样 cmd pitch=0（水平）会解出
  # fb(fix90) pitch=90°、roll/yaw 一起退化，看着像"万向锁"，其实是被这次多余
  # 的修正推到奇点上的。取 0 之后 cmd pitch=0 的反馈是
  # yaw=0.000 pitch=0.000 roll=0.000，远离奇点。
  # 除非仿真端改了发布式，别动。
  feedback_pitch_fix_deg: 0.0
  state_timeout_ms: 450.0
  safe_stop_period_ms: 20.0
  # 目标丢失多久后置 FAULT_TARGET_LOST
  target_lost_ms: 300.0
  # 外参自检：观测到的 camera 相对平移与 t_camera2gimbal 的允许偏差
  extrinsic_tol_m: 0.01
  # 内参自检：与共享内存 CameraInfo 的允许偏差
  intrinsic_tol_px: 0.5
